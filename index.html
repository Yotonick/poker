<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120709">
<title>ROYAL TABLE</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/table.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">

  <!-- ГЛАВНОЕ МЕНЮ -->
  <section id="screen-menu" class="screen active" aria-label="Главное меню">
    <div class="menu-glow"></div>
    <header class="menu-top">
      <button class="chip" id="btn-level" data-action="profile" aria-label="Профиль">
        <span class="chip-lvl" id="menu-level">1</span>
        <span class="chip-xp"><i id="menu-xp-bar"></i></span>
      </button>
      <div class="chip chip-balance"><span class="chip-icon"></span><b id="menu-balance">0</b></div>
      <button class="chip chip-round" data-action="settings" aria-label="Настройки">⚙</button>
    </header>

    <div class="menu-hero">
      <img class="menu-dealer" id="menu-dealer-img" alt="Дилер" draggable="false">
      <div class="menu-title">
        <h1>ROYAL<span>TABLE</span></h1>
        <p>Закрытый покерный клуб</p>
      </div>
    </div>

    <nav class="menu-actions">
      <button class="btn btn-primary btn-xl" data-action="play">Играть</button>
      <button class="btn btn-ghost" id="btn-refill" data-action="refill" hidden></button>
      <div class="menu-row">
        <button class="btn btn-ghost" data-action="collection">Коллекция</button>
        <button class="btn btn-ghost" data-action="profile">Профиль</button>
      </div>
    </nav>
  </section>

  <!-- ИГРОВОЙ ЭКРАН -->
  <section id="screen-game" class="screen" aria-label="Игровой стол">
    <header class="game-top">
      <button class="icon-btn" data-action="exit" aria-label="В меню">‹</button>
      <div class="top-info">
        <span class="top-blinds">Блайнды <b id="g-blinds">25 / 50</b></span>
        <span class="top-hand">Раздача <b id="g-hand">1</b></span>
      </div>
      <div class="chip chip-balance"><span class="chip-icon"></span><b id="g-balance">0</b></div>
    </header>

    <div class="dealer-zone">
      <div class="dealer-stage">
        <img id="dealer-img" class="dealer-img" alt="Дилер" draggable="false">
        <div class="dealer-bubble" id="dealer-bubble" hidden></div>
      </div>
    </div>

    <div class="table-zone">
      <div class="table" id="table">
        <div class="table-rim"></div>
        <div class="table-felt"></div>
        <div class="pot" id="pot"><span class="pot-chips"></span><span>Банк <b id="pot-amount">0</b></span></div>
        <div class="board" id="board"></div>
        <div class="table-status" id="table-status"></div>
      </div>
      <div id="seats"></div>
    </div>

    <div class="player-zone">
      <div class="hero-cards" id="hero-cards"></div>
      <div class="hero-info" id="hero-info"></div>
    </div>

    <div class="action-panel" id="action-panel">
      <div class="bet-box" id="bet-box" hidden>
        <div class="bet-head"><span>Размер ставки</span><b id="bet-value">0</b></div>
        <input type="range" id="bet-slider" min="0" max="100" step="1" value="0" aria-label="Размер ставки">
        <div class="bet-quick" id="bet-quick"></div>
        <div class="bet-confirm">
          <button class="btn btn-ghost" id="bet-cancel">Назад</button>
          <button class="btn btn-primary" id="bet-ok">Подтвердить</button>
        </div>
      </div>
      <div class="actions" id="actions"></div>
    </div>
  </section>

  <!-- МОДАЛЬНЫЕ ПАНЕЛИ -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <header class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close" aria-label="Закрыть">✕</button></header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="js/telegram.js"></script>
<script src="js/storage.js"></script>
<script src="js/collections.js"></script>
<script src="js/progress.js"></script>
<script src="js/engine/cards.js"></script>
<script src="js/engine/evaluator.js"></script>
<script src="js/engine/hand.js"></script>
<script src="js/bots.js"></script>
<script src="js/sound.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
